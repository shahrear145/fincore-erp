<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সার্ভারে সাময়িক সমস্যা — FinCore ERP</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/static/web/favicon.svg">
<style>
  :root{--ink:#0f2244;--muted:#64748b;--blue:#2563eb;--line:#e2e8f5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Hind Siliguri","Inter",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(900px 520px at 85% -5%,#dbeafe,transparent 55%),
               radial-gradient(700px 500px at 0% 25%,#d1fae5,transparent 45%),
               #f4f7ff}
  main{text-align:center;max-width:520px}
  .coin{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;
    font-size:34px;font-weight:800;color:#7c2d12;
    background:radial-gradient(circle at 32% 28%,#fef3c7,#f59e0b 60%,#d97706);
    box-shadow:0 18px 36px rgba(217,119,6,.35)}
  h1{margin:0;font-size:30px;letter-spacing:-.03em}
  .lead{margin:10px 0 4px;font-size:17px;font-weight:700}
  .sub{margin:0 0 26px;color:var(--muted);line-height:1.7}
  a.btn{display:inline-flex;gap:8px;align-items:center;padding:13px 26px;border-radius:13px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;text-decoration:none;
    font-weight:700;box-shadow:0 16px 34px rgba(37,99,235,.32)}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main>
  <div class="coin">৳</div>
  <h1>সাময়িক সমস্যা হয়েছে</h1>
  <p class="lead">পেজটি লোড করতে সমস্যা হচ্ছে</p>
  <p class="sub">কিছুক্ষণ পর আবার চেষ্টা করুন। সমস্যা persist হলে সাইট অ্যাডমিনের সাথে যোগাযোগ করুন।</p>
  <a class="btn" href="/">হোমে ফিরুন</a>
</main>
</body>
</html>
