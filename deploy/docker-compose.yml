version: "3.9"

# FinCore ERP production-like stack
# Usage:  cd deploy && docker compose up -d --build
# API is served on http://localhost:8000

x-django-env: &django-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  POSTGRES_DB: fincore
  POSTGRES_USER: fincore
  POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    command: celery -A config worker -l info
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    profiles: ["devtools"]

volumes:
  pgdata:
  static_files:
  media_files:
